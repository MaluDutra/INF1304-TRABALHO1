line-length = 100
target-version = "py312"

[lint]
# Só ativa as regras de preview escolhidas explicitamente (DOC)
preview = true
explicit-preview-rules = true

select = [
    "E",      # pycodestyle (erros)
    "W",      # pycodestyle (avisos)
    "F",      # pyflakes
    "I",      # isort (ordem dos imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "RUF",    # regras específicas do Ruff
    "S",      # flake8-bandit (segurança)
    "T20",    # flake8-print (proíbe print; use logging)
    "ANN",    # flake8-annotations: tipos de parâmetros e de retorno
    "D",      # pydocstyle: docstrings
    "DOC",    # pydoclint: seções Returns/Raises/Yields das docstrings
]

ignore = [
    "D107",   # Args fica na docstring da classe, não no __init__
    "D203",   # conflita com D211
    "D213",   # conflita com D212
    "S311",   # random é usado só para simular leituras, não para fins criptográficos
]

[lint.pydocstyle]
# Seções Args/Returns/Raises no estilo Google (D417 exige todos os parâmetros documentados)
convention = "google"

[lint.pylint]
max-args = 6

[lint.per-file-ignores]
"__init__.py" = ["D104"]
