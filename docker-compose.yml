  # Um sensor para cada máquina: setor-máquina (o nome de cada máquina é composto por três letras maiúsculas)
  sensor_trn:
    build: ./produtor
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    environment:
      SENSOR_ID: producao-TRN
      SETOR: producao
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      TOPICO_SENSORES: ${TOPICO_SENSORES}
      INTERVALO_SEGUNDOS: ${INTERVALO_SEGUNDOS}
      TEMP_MIN: ${TEMP_MIN}
      TEMP_MAX: ${TEMP_MAX}
      VIBRACAO_MIN: ${VIBRACAO_MIN}
      VIBRACAO_MAX: ${VIBRACAO_MAX}
      UMIDADE_MIN: ${UMIDADE_MIN}
      UMIDADE_MAX: ${UMIDADE_MAX}
      ENERGIA_MIN: ${ENERGIA_MIN}
      ENERGIA_MAX: ${ENERGIA_MAX}
