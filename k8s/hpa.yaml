# Horizontal Pod Autoscaler do consumidor.
# Ajusta automaticamente o número de réplicas conforme o uso de CPU.
# O teto de 3 réplicas não é arbitrário: o tópico tem 3 partições, e
# no Kafka cada partição é atribuída a no máximo um consumidor do
# grupo. Uma 4ª réplica ficaria permanentemente ociosa.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consumidor-hpa
  namespace: fabrinteligente
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consumidor
  minReplicas: 1
  maxReplicas: ${MAX_CONSUMIDORES}
  behavior:
    scaleDown:
      # Espera 60s de calmaria antes de reduzir, evitando subir e descer repetidamente com oscilações curtas
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Percentual sobre requests.cpu (100m). O valor vem do .env e foi medido neste
          # cluster: 6 sensores levam o consumidor a ~4m e 60 sensores a ~18m, então 8%
          # (8m) só dispara quando o número de produtores aumenta
          averageUtilization: ${HPA_CPU_ALVO}
