# Sensor da máquina producao-TRN.
# Cada sensor é um Deployment de 1 réplica: representa uma máquina
# física específica, com identidade e setor fixos. As faixas de
# medição e o endereço do Kafka vêm do ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-trn
  namespace: fabrinteligente
  labels:
    app: sensor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor
      maquina: trn
  template:
    metadata:
      labels:
        app: sensor
        maquina: trn
    spec:
      containers:
        - name: sensor
          image: ${DOCKER_USER}/fabrica-sensor:${TAG_SENSOR}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: fabrica-config
          env:
            - name: SENSOR_ID
              value: "producao-TRN"
            - name: SETOR
              value: "producao"
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"

